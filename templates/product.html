<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Name }} - Hello Shop</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-sub: #6b7280;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background-color: var(--card-bg);
            padding: 1.5rem 0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            text-align: center;
            margin-bottom: 2rem;
        }

        header a {
            text-decoration: none;
            color: inherit;
        }

        h1 {
            margin: 0;
            color: var(--primary);
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.025em;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 0 1.5rem;
            box-sizing: border-box;
        }

        .product-detail {
            background-color: var(--card-bg);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .image-container {
            width: 100%;
            height: 400px;
            background-color: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: #9ca3af;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            padding: 2rem;
        }

        .product-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .product-price {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .product-description {
            font-size: 1.125rem;
            line-height: 1.6;
            color: var(--text-sub);
            margin-bottom: 2rem;
        }

        .back-btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: var(--bg);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .back-btn:hover {
            background-color: #e5e7eb;
        }
    </style>
</head>

<body>
    <header>
        <a href="/">
            <h1>Hello Shop</h1>
        </a>
    </header>

    <div class="container">
        <div class="product-detail">
            <div class="image-container">
                {{ if .ImageURL }}
                <img src="{{ .ImageURL }}" alt="{{ .Name }}">
                {{ else }}
                🛍️
                {{ end }}
            </div>
            <div class="content">
                <div class="product-title">{{ .Name }}</div>
                <div class="product-price">${{ .Price }}</div>
                <div class="product-description">
                    {{ .Description }}
                </div>
                <a href="/" class="back-btn">← Back to List</a>
            </div>
        </div>
    </div>
</body>

</html>
