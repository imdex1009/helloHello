<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Name }} - Hello Shop</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-color: #0071e3;
            --nav-bg: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fff;
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Navigation (Same as index) */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            background-color: var(--nav-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header a {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        header a:hover {
            opacity: 1;
        }

        /* Sticky Layout Container */
        .container {
            display: flex;
            flex-direction: column;
            padding-top: 44px;
            /* header height */
            min-height: 100vh;
        }

        @media (min-width: 768px) {
            .container {
                flex-direction: row;
            }
        }

        /* Left Side: Image */
        .image-section {
            flex: 1;
            background-color: #f5f5f7;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
            padding: 40px;
        }

        @media (min-width: 768px) {
            .image-section {
                height: calc(100vh - 44px);
                position: sticky;
                top: 44px;
            }
        }

        .image-section img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.1));
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        /* Right Side: Details */
        .details-section {
            flex: 1;
            padding: 60px 40px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-new-label {
            color: #bf4800;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.003em;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 24px;
            color: var(--text-primary);
            margin-bottom: 40px;
            font-weight: 500;
        }

        .product-description {
            font-size: 19px;
            line-height: 1.5;
            color: var(--text-secondary);
            font-weight: 400;
            margin-bottom: 60px;
            max-width: 500px;
        }

        .actions {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .buy-btn {
            background-color: #0071e3;
            color: white;
            padding: 18px 32px;
            border-radius: 980px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            transition: background-color 0.2s;
            display: inline-block;
        }

        .buy-btn:hover {
            background-color: #0077ed;
        }

        .back-link {
            color: #0071e3;
            text-decoration: none;
            font-size: 17px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <header>
        <a href="/">Hello Shop</a>
    </header>

    <div class="container">
        <div class="image-section">
            <img src="{{ .ImageURL }}" alt="{{ .Name }}">
        </div>
        <div class="details-section">
            <div>
                <div class="product-new-label">NEW</div>
                <h1 class="product-title">{{ .Name }}</h1>
                <div class="product-price">${{ .Price }}</div>
                <div class="product-description">
                    {{ .Description }}
                </div>

                <div class="actions">
                    <a href="#" class="buy-btn">Add to Bag</a>
                    <a href="/" class="back-link">Review other products ></a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
