<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Shop</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-color: #0071e3;
            --card-bg: #ffffff;
            --nav-bg: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Navigation */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--nav-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header a {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        header a:hover {
            opacity: 1;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 80px 0;
            background-color: #000;
            color: #fff;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 700;
            margin: 0 0 10px 0;
            letter-spacing: -0.005em;
        }

        .hero p {
            font-size: 24px;
            color: #86868b;
            font-weight: 400;
            margin: 0;
        }

        .hero-image {
            margin-top: 40px;
            max-width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: contain;
        }

        /* Product Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
            padding-bottom: 80px;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            height: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 18px;
            /* Smooth corners */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 20px;
            box-sizing: border-box;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            height: 100%;
        }

        .card:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .card-content {
            text-align: center;
            margin-bottom: 30px;
            z-index: 2;
        }

        .product-name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 17px;
            color: var(--text-primary);
        }

        .card-image {
            width: 100%;
            height: 300px;
            /* Fixed height for image area */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        .card-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Featured Card Style (Make every 3rd card span 2 columns if screen allows) */
        @media (min-width: 800px) {
            .card-link:nth-child(3n+1) {
                grid-column: span 2;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="/">Hello Shop</a>
    </header>

    <!-- Hero Section: Featured Product (Nano Banana) -->
    <div class="hero">
        <h1>Nano Banana</h1>
        <p>The future of fruit is here.</p>
        <img src="/public/images/nano_banana.png" alt="Nano Banana" class="hero-image">
    </div>

    <div class="container">
        {{ if . }}
        <div class="grid">
            {{ range . }}
            <a href="/products/{{ .ID }}" class="card-link">
                <div class="card">
                    <div class="card-content">
                        <div class="product-name">{{ .Name }}</div>
                        <div class="product-price">
                            <span class="currency">$</span>{{ .Price }}
                        </div>
                    </div>
                    <div class="card-image">
                        {{ if .ImageURL }}
                        <img src="{{ .ImageURL }}" alt="{{ .Name }}">
                        {{ else }}
                        <div style="font-size: 4rem;">🛍️</div>
                        {{ end }}
                    </div>
                </div>
            </a>
            {{ end }}
        </div>
        {{ else }}
        <p style="text-align: center; font-size: 1.2rem; color: var(--text-secondary); margin-top: 4rem;">
            No products available yet.
        </p>
        {{ end }}
    </div>
</body>

</html>
