<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Shop</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-sub: #6b7280;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background-color: var(--card-bg);
            padding: 1.5rem 0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0;
            color: var(--primary);
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.025em;
        }

        .container {
            width: 100%;
            max-width: 1024px;
            padding: 0 1.5rem;
            box-sizing: border-box;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            padding-bottom: 3rem;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.2s;
        }

        .card-link:hover {
            transform: translateY(-4px);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card-link:hover .card {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Removed .card:hover as it is handled by .card-link:hover now */

        .card-image {
            width: 100%;
            height: 200px;
            background-color: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #9ca3af;
        }

        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .product-price {
            font-size: 1.125rem;
            color: var(--primary);
            font-weight: 600;
        }

        .currency {
            font-size: 0.875em;
            color: var(--text-sub);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 0;
            color: var(--text-sub);
            font-size: 1.125rem;
        }
    </style>
</head>

<body>
    <header>
        <h1>Hello Shop</h1>
    </header>

    <div class="container">
        {{ if . }}
        <div class="grid">
            {{ range . }}
            <a href="/products/{{ .ID }}" class="card-link">
                <div class="card">
                    <div class="card-image">
                        {{ if .ImageURL }}
                        <img src="{{ .ImageURL }}" alt="{{ .Name }}"
                            style="width: 100%; height: 100%; object-fit: cover;">
                        {{ else }}
                        🛍️
                        {{ end }}
                    </div>
                    <div class="card-content">
                        <div class="product-name">{{ .Name }}</div>
                        <div class="product-price">
                            <span class="currency">$</span>{{ .Price }}
                        </div>
                    </div>
                </div>
            </a>
            {{ end }}
        </div>
        {{ else }}
        <div class="empty-state">
            아직 등록된 상품이 없습니다. 📦
        </div>
        {{ end }}
    </div>
</body>

</html>
